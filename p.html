<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0510">
<title>Eterniza 💕</title>
<style>
  :root{ --rose:#ff5d8f; --rose2:#ff8fb1; --gold:#ffd479; --text:#fff; --muted:#e6c8d6; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    background:radial-gradient(1200px 700px at 50% -10%, #5a1233, transparent 60%),
      radial-gradient(900px 600px at 50% 110%, #2a0b3d, transparent 60%),#0a0510;
    overflow-x:hidden;min-height:100vh}
  .hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .heart{position:absolute;top:-30px;font-size:18px;animation:fall linear infinite;opacity:.8}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
  .wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:40px 20px 70px;text-align:center}
  .tag{display:inline-block;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--rose2);
    border:1px solid rgba(255,143,177,.4);border-radius:30px;padding:6px 16px;margin-bottom:24px}
  .names{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:6px}
  .names .amp{color:var(--rose);margin:0 6px}
  .since{color:var(--muted);font-size:14px;margin-bottom:30px}
  .counter-title{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--rose2);margin-bottom:14px}
  .counter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:38px}
  .unit{background:rgba(255,255,255,.06);border:1px solid rgba(255,143,177,.25);border-radius:14px;padding:12px 6px;min-width:62px;backdrop-filter:blur(6px)}
  .unit .n{font-size:24px;font-weight:800;line-height:1}
  .unit .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
  .photos{position:relative;width:100%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;margin-bottom:34px;border:none;
    box-shadow:0 0 0 3px rgba(255,93,143,.7), 0 0 0 7px rgba(255,255,255,.08), 0 0 35px rgba(255,93,143,.3), 0 30px 70px rgba(0,0,0,.5)}
  .photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s}
  .photos img.on{opacity:1}
  .photos .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:3}
  .photos .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .photos .dots i.on{background:#fff;width:18px;border-radius:4px}
  .msg{background:rgba(255,255,255,.05);border:1px solid rgba(255,143,177,.2);border-radius:18px;padding:22px;font-size:16.5px;line-height:1.6;color:#fff;margin-bottom:28px;font-style:italic}
  .msg::before{content:'❝';color:var(--rose);font-size:30px;display:block;line-height:0;margin-bottom:10px}
  .music{margin-bottom:30px}
  .music .mt{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--rose2);margin-bottom:12px}
  .music iframe{width:100%;border:none;border-radius:14px}
  .namorados{font-size:19px;font-weight:800;background:linear-gradient(135deg,#ff5d8f,#ffd479);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 16px;letter-spacing:.3px}
  .heart-big{font-size:34px;animation:beat 1.4s ease-in-out infinite;display:inline-block}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
  .foot{color:var(--muted);font-size:12px;margin-top:10px;opacity:.7}
  .foot b{color:var(--rose2)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--rose2);font-size:15px;z-index:5}
  .intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 38%, #5a1233, #0a0510);transition:opacity .8s}
  .intro.hide{opacity:0;pointer-events:none}
  .intro-emoji{font-size:66px;margin-bottom:18px;animation:beat 1.4s ease-in-out infinite}
  .intro-txt{color:#fff;font-size:20px;font-weight:600;margin-bottom:26px;line-height:1.4;max-width:340px}
  .intro-btn{background:linear-gradient(135deg,#ff5d8f,#c2407e);border:none;color:#fff;font-weight:800;font-size:17px;padding:16px 36px;border-radius:16px;box-shadow:0 12px 34px rgba(255,93,143,.5);cursor:pointer;animation:fadeUp .6s both}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="intro-card">
    <div class="intro-emoji">💌</div>
    <div class="intro-txt" id="introTxt">Você recebeu um presente especial...</div>
    <button class="intro-btn" id="introBtn">Toque para abrir 💕</button>
  </div>
</div>
<div class="hearts" id="hearts"></div>
<div class="loading" id="loading">💕 Carregando o amor de vocês...</div>
<div class="wrap" id="wrap" style="display:none">
  <div class="tag">Para sempre 💕</div>
  <h1 class="names" id="names"></h1>
  <div class="since" id="since"></div>
  <div class="counter-title">Nosso tempo juntos</div>
  <div class="counter" id="counter"></div>
  <div class="photos" id="photos"><div class="dots" id="dots"></div></div>
  <div class="msg" id="msg"></div>
  <div class="music" id="music"></div>
  <div class="namorados">💕 Feliz Dia dos Namorados 💕</div>
  <div class="heart-big">❤️</div>
  <div class="foot">Feito com amor no <b>Eterniza</b></div>
</div>

<script>
const SUPA_URL='https://jjdoyotxgxdgzyqjpqzz.supabase.co';
const SUPA_KEY='sb_publishable_14F42s5XskCh1z3HJxWw4A_DiHpcSSz';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let pendingMusic=null;
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function abrirPresente(){
  const i=document.getElementById('intro'); if(!i||i.classList.contains('hide')) return;
  i.classList.add('hide');
  const f=document.getElementById('musicFrame'); if(f&&pendingMusic) f.src=pendingMusic;
  setTimeout(()=>{ i.style.display='none'; },900);
}

const SAMPLE={ nome1:'João', nome2:'Maria', inicio:'2020-02-14T20:30:00',
  mensagem:'Desde o dia em que te conheci, minha vida ganhou cor. Você é meu hoje, meu amanhã e meu para sempre. Te amo! 💍',
  fotos:['https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800&q=80','https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=800&q=80'],
  musica:'https://open.spotify.com/embed/track/0tgVpDi06FyKpA1z0VMD4v' };

async function loadData(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id) return SAMPLE;
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/eterniza_pages?slug=eq.${encodeURIComponent(id)}&select=data`,
      { headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY } });
    const rows=await r.json();
    if(rows && rows[0] && rows[0].data) return rows[0].data;
  }catch(e){}
  return SAMPLE;
}

function render(DATA){
  document.getElementById('loading').style.display='none';
  document.getElementById('wrap').style.display='';
  document.getElementById('names').innerHTML = esc(DATA.nome1)+' <span class="amp">❤</span> '+esc(DATA.nome2);
  const di=new Date(DATA.inicio);
  document.getElementById('since').textContent='Juntos desde '+di.getDate()+' de '+MESES[di.getMonth()]+' de '+di.getFullYear();
  document.getElementById('msg').textContent=DATA.mensagem;

  const UNITS=[['anos'],['meses'],['dias'],['horas'],['min'],['seg']];
  function diff(){ const now=new Date(); let y=now.getFullYear()-di.getFullYear(),mo=now.getMonth()-di.getMonth(),d=now.getDate()-di.getDate(),h=now.getHours()-di.getHours(),m=now.getMinutes()-di.getMinutes(),s=now.getSeconds()-di.getSeconds();
    if(s<0){s+=60;m--}if(m<0){m+=60;h--}if(h<0){h+=24;d--}if(d<0){const pm=new Date(now.getFullYear(),now.getMonth(),0).getDate();d+=pm;mo--}if(mo<0){mo+=12;y--}
    return {anos:y,meses:mo,dias:d,horas:h,min:m,seg:s}; }
  function rc(){ const v=diff(); document.getElementById('counter').innerHTML=UNITS.map(([k])=>`<div class="unit"><div class="n">${v[k]}</div><div class="l">${k}</div></div>`).join(''); }
  rc(); setInterval(rc,1000);

  const ph=document.getElementById('photos'), dots=document.getElementById('dots');
  (DATA.fotos||[]).forEach((src,i)=>{ const im=new Image(); im.src=src; im.className=i===0?'on':''; ph.insertBefore(im,dots); const dt=document.createElement('i'); if(i===0)dt.className='on'; dots.appendChild(dt); });
  const imgs=[...ph.querySelectorAll('img')]; let pi=0;
  if(imgs.length>1) setInterval(()=>{ imgs[pi].classList.remove('on'); dots.children[pi].classList.remove('on'); pi=(pi+1)%imgs.length; imgs[pi].classList.add('on'); dots.children[pi].classList.add('on'); },3500);

  if(DATA.musica){ const h=DATA.musica.includes('spotify')?152:200;
    document.getElementById('music').innerHTML=`<div class="mt">🎵 Nossa música</div><iframe id="musicFrame" src="about:blank" height="${h}" allow="autoplay; encrypted-media"></iframe>`;
    pendingMusic=DATA.musica.includes('spotify')? DATA.musica : DATA.musica+(DATA.musica.includes('?')?'&':'?')+'autoplay=1';
  }
  const introTxt=document.getElementById('introTxt');
  if(introTxt) introTxt.innerHTML=`<b>${esc(DATA.nome1)}</b> preparou um presente especial pra <b>${esc(DATA.nome2)}</b>...`;
}
// abertura: o toque "desembrulha" o presente E libera a música (regra do navegador exige um toque)
document.getElementById('introBtn').onclick=abrirPresente;

const HE=document.getElementById('hearts'); const EMO=['❤️','💕','💖','💗','🤍'];
for(let i=0;i<22;i++){ const s=document.createElement('div'); s.className='heart'; s.textContent=EMO[i%EMO.length]; s.style.left=Math.random()*100+'vw'; s.style.fontSize=(12+Math.random()*16)+'px'; s.style.animationDuration=(6+Math.random()*7)+'s'; s.style.animationDelay=(Math.random()*8)+'s'; HE.appendChild(s); }

loadData().then(render);
</script>
</body>
</html>
